name: enterprise-rag

services:
  rustfs:
    image: rustfs/rustfs:1.0.4-glibc
    profiles: ["dev"]
    command: ["/data"]
    env_file:
      - ./dev-envs/rustfs.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["dev"]
    env_file:
      - ./dev-envs/qdrant.env
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # restart: unless-stopped

volumes:
  rustfs-data:
  qdrant-data:
