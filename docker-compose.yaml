name: enterprise-rag

services:
  rustfs:
    image: rustfs/rustfs:1.0.4-glibc
    profiles: ["dev"]
    command: ["/data"]
    env_file:
      - ./dev-envs/rustfs.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["dev"]
    env_file:
      - ./dev-envs/qdrant.env
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # restart: unless-stopped

  # Build this shared image before the child application images.
  enterprise-rag-base:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: Dockerfiles/enterprise-rag-base
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "sleeping"
          sleep 60
        done

  enterprise-rag-indexing:
    profiles: ["dev"]
    build:
      context: ./enterprise-rag-indexing
      dockerfile: Dockerfiles/enterprise-rag-indexing
      additional_contexts:
        enterprise_rag_base: service:enterprise-rag-base
    depends_on:
      enterprise-rag-base:
        condition: service_started
      rustfs:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./enterprise-rag-indexing/app:/app/app
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "sleeping"
          sleep 5
        done

volumes:
  rustfs-data:
  qdrant-data:
